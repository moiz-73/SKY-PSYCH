# SkyPsych - local logging configuration
# Console output by default, optional file output.
# No remote logging endpoint (privacy constraint: no cloud dependency).

version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  telemetry:
    format: "TELEMETRY %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: INFO
    formatter: telemetry
    filename: logs/skypsych.log
    encoding: utf-8

loggers:
  skypsych.telemetry:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
